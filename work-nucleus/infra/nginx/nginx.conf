upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:3001;
}

upstream support_admin {
    server support-admin:3002;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Backend API (v1 & v2)
    location ~ ^/api/v[12]/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Block public Swagger docs & internal Python AI service endpoints
    location /api/docs {
        return 404;
    }

    location /ai/ {
        return 404;
    }

    # Health check
    location /health {
        proxy_pass http://backend/api/v1/health;
    }

    # Support Admin Portal (mounted cleanly away from Company Portal /support route;
    # prefer hosting support-admin on its own subdomain such as admin.questedge.in)
    location /support-admin/ {
        proxy_pass http://support_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (catch-all, includes /support and Next.js /api/* BFF proxies)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
