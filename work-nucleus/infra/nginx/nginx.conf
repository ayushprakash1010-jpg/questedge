upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:3001;
}

upstream ai_service {
    server ai-service:8000;
}

upstream support_admin {
    server support-admin:3002;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # AI Service (internal only — should be blocked in production)
    location /ai/ {
        proxy_pass http://ai_service/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health checks
    location /health {
        proxy_pass http://backend/api/v1/health;
    }

    location /ai/health {
        proxy_pass http://ai_service/ai/health;
    }

    # Support Admin Portal
    location /support/ {
        proxy_pass http://support_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (catch-all)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
