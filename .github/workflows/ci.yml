name: QuestEdge CI Pipeline

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend (Type-check & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-nucleus/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: work-nucleus/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --passWithNoTests

  frontend-check:
    name: Frontend (Type-check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-nucleus/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: work-nucleus/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.questedge.example.com
          NEXT_PUBLIC_AUTH0_DOMAIN: dummy.auth0.com
          NEXT_PUBLIC_AUTH0_CLIENT_ID: dummy_client_id

  support-admin-check:
    name: Support Admin (Type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-nucleus/support-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: work-nucleus/support-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check
        run: npx tsc --noEmit
